name: Build and Deploy (GitHub Pages)

on:
  push:
    branches: [ main ]
  schedule:
    # Weekly Monday 08:00 UTC (after SKB's Monday 06:00 UTC refresh)
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout soil-series-viewer
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Configure upstream data paths
        run: |
          UPSTREAM_DIR="$RUNNER_TEMP/upstream"
          {
            echo "UPSTREAM_DIR=$UPSTREAM_DIR"
            echo "OSD_SC_PATH=$UPSTREAM_DIR/OSDRegistry/SC/SCDB.csv"
            echo "OSD_SKB_DIR=$UPSTREAM_DIR/SoilKnowledgeBase/inst/extdata/OSD"
            echo "OSD_TXT_DIR=$UPSTREAM_DIR/OSDRegistry/OSD"
            echo "OSD_KST_DIR=$UPSTREAM_DIR/SoilKnowledgeBase/inst/extdata/KST"
            echo "OSD_FEATURELIST_PATH=$UPSTREAM_DIR/SoilKnowledgeBase/inst/extdata/KST/2014_KST_EN_featurelist.json"
            echo "OSD_DST_DATA_PATH=$UPSTREAM_DIR/DST/data/dst-data.json"
            echo "SOIL_PROFILES_PATH=$UPSTREAM_DIR/SoilProfiles.js/dist/index.js"
          } >> "$GITHUB_ENV"

      - name: Shallow-clone upstream data repositories
        run: |
          mkdir -p "$UPSTREAM_DIR"
          git clone --depth 1 https://github.com/ncss-tech/OSDRegistry.git "$UPSTREAM_DIR/OSDRegistry"
          git clone --depth 1 https://github.com/ncss-tech/SoilKnowledgeBase.git "$UPSTREAM_DIR/SoilKnowledgeBase"
          git clone --depth 1 https://github.com/brownag/SoilProfiles.js.git "$UPSTREAM_DIR/SoilProfiles.js"
          git clone --depth 1 https://github.com/brownag/DST.git "$UPSTREAM_DIR/DST"

      - name: Ensure SoilProfiles.js bundle is built
        run: |
          if [ ! -f "$SOIL_PROFILES_PATH" ]; then
            cd "$UPSTREAM_DIR/SoilProfiles.js"
            npm ci
            npm run build
          fi

      - name: Restore incremental OSD_Docs build cache
        uses: actions/cache@v4
        with:
          path: |
            dist/OSD_Docs
            dist/.build-cache.json
          key: osd-build-${{ hashFiles('src/**') }}-${{ github.run_id }}
          restore-keys: |
            osd-build-${{ hashFiles('src/**') }}-
            osd-build-

      - name: Build static site (incremental)
        run: node src/cli/build.js --out dist --incremental

      - name: Run Pagefind full-text indexing
        run: npx --yes pagefind --site dist

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
